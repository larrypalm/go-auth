name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go vet ./...
      # The root package hashes at bcrypt cost 12 and takes about 4 minutes under -race on a laptop,
      # so the default 10-minute timeout is too tight for a CI runner.
      - run: go test -race -timeout 20m ./...
