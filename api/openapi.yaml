openapi: "3.1.0"
info:
  title: go-auth API
  version: 0.2.0
  description: >
    Reusable auth endpoints — mountable handlers for Go APIs. JWT + bcrypt + refresh tokens.
    In cookie mode (Config.CookieMode), the routes that issue tokens set the httpOnly cookies
    goauth_access (path /) and goauth_refresh (path /auth) and return only the user. Every route
    then answers an unsafe cross-origin request with 403 and the error code cross_origin.
servers:
  - url: http://localhost:8080
    description: Local development

paths:
  /auth/register:
    post:
      summary: Register a new user
      description: Not mounted when Config.DisableRegister is set.
      operationId: registerUser
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
      responses:
        "201":
          description: User created successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "400":
          description: Validation error (missing fields, invalid email, weak password)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Email already registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/login:
    post:
      summary: Log in with email and password
      operationId: loginUser
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Login successful
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "401":
          description: Invalid email or password
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/refresh:
    post:
      summary: Exchange refresh token for new token pair
      description: In cookie mode, reads the token from the refresh cookie and ignores the body.
      operationId: refreshToken
      tags: [Auth]
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshRequest"
      responses:
        "200":
          description: Tokens refreshed successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "401":
          description: Invalid, expired, or revoked refresh token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/logout:
    post:
      summary: Revoke refresh token (log out)
      description: >
        In cookie mode, reads the token from the refresh cookie, ignores the body and clears
        both cookies. It returns 204 even when the request has no refresh cookie.
      operationId: logoutUser
      tags: [Auth]
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshRequest"
      responses:
        "204":
          description: Logged out successfully
        "401":
          description: Invalid refresh token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/password-reset/request:
    post:
      summary: Request a password reset
      description: >
        Sends a password reset email if the address is registered.
        Always returns 200 regardless of whether the email exists (anti-enumeration).
        Rate limited: one reset email per address every 5 minutes.
      operationId: requestPasswordReset
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasswordResetRequest"
      responses:
        "200":
          description: >
            Reset email sent (or silently ignored if email not found).
            Response is always the same to prevent email enumeration.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PasswordResetRequestResponse"
        "400":
          description: Missing email field
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/password-reset/confirm:
    post:
      summary: Confirm password reset
      description: >
        Sets a new password using the reset token from the email link.
        Token is single-use with 1-hour expiry. All existing refresh tokens
        are revoked on success (forces re-login on all devices).
      operationId: confirmPasswordReset
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasswordResetConfirm"
      responses:
        "200":
          description: Password updated successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PasswordResetConfirmResponse"
        "400":
          description: Missing fields or weak password
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "410":
          description: Token expired, already used, or invalid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/oauth/{provider}:
    post:
      summary: Authenticate via OAuth provider
      description: >
        Validates an OAuth ID token from the specified provider.
        If the provider user ID is already linked, returns tokens for the linked user.
        If unlinked but email matches an existing verified user, links and returns tokens.
        Otherwise creates a new user and link, then returns tokens.
      operationId: oauthLogin
      tags: [OAuth]
      parameters:
        - name: provider
          in: path
          required: true
          schema:
            type: string
            example: "apple"
          description: OAuth provider name (e.g. "apple", "google")
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OAuthRequest"
      responses:
        "200":
          description: Authentication successful (existing user)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "201":
          description: Authentication successful (new user created)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "400":
          description: Unknown provider or missing id_token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Invalid or expired ID token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

components:
  schemas:
    RegisterRequest:
      type: object
      required: [email, password, name]
      properties:
        email:
          type: string
          format: email
          example: "larry@example.com"
        password:
          type: string
          format: password
          minLength: 8
          example: "strongpassword123"
        name:
          type: string
          minLength: 1
          example: "Larry"

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password

    RefreshRequest:
      type: object
      required: [refresh_token]
      properties:
        refresh_token:
          type: string

    OAuthRequest:
      type: object
      required: [id_token]
      properties:
        id_token:
          type: string
          description: ID token from the OAuth provider (e.g. Apple/Google JWT)
        name:
          type: string
          description: >
            Optional display name fallback. Used when creating a new user
            if the provider doesn't include the name (e.g. Apple only sends
            name on first authorization).

    AuthResponse:
      type: object
      required: [user]
      properties:
        access_token:
          type: string
          description: Short-lived JWT (15 min). Left out in cookie mode.
        refresh_token:
          type: string
          description: Long-lived opaque token (30 days). Left out in cookie mode.
        user:
          $ref: "#/components/schemas/User"

    User:
      type: object
      required: [id, email, name, created_at]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        name:
          type: string
        created_at:
          type: string
          format: date-time

    PasswordResetRequest:
      type: object
      required: [email]
      properties:
        email:
          type: string
          format: email

    PasswordResetRequestResponse:
      type: object
      required: [message]
      properties:
        message:
          type: string
          example: "If an account with that email exists, a reset link has been sent."

    PasswordResetConfirm:
      type: object
      required: [token, password]
      properties:
        token:
          type: string
          description: Raw reset token from the email link
        password:
          type: string
          format: password
          minLength: 8

    PasswordResetConfirmResponse:
      type: object
      required: [message]
      properties:
        message:
          type: string
          example: "Password has been reset successfully."

    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              description: Machine-readable error code
              example: "email_taken"
            message:
              type: string
              description: Human-readable error message
              example: "A user with this email already exists"

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    cookieAuth:
      type: apiKey
      in: cookie
      name: goauth_access
      description: Cookie mode only. Middleware reads it when there is no Authorization header.
